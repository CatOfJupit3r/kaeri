name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/apps/server/.mongodb-binaries
      MONGOMS_VERSION: 7.0.14

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install Node 24.11.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Restore MongoDB binary cache
        id: cache-mongodb
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: ${{ runner.os }}-mongodb-${{ env.MONGOMS_VERSION }}
          restore-keys: |
            ${{ runner.os }}-mongodb-

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm run build:deps

      - name: Pre-download MongoDB Memory Server binary (LLM env)
        run: pnpm tsx scripts/predownload-mongodb.ts
        env:
          MONGOMS_DOWNLOAD_MIRROR: https://fastdl.mongodb.org

      - name: Verify installation
        run: |
          pnpm --version
