name: Pull Request | Server

on:
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - ".github/workflows/pull-request-coordinator.yml"
            - "pnpm-lock.yaml"
            - "apps/server/**/*.ts"
            - "apps/server/package.json"
            - "apps/server/tsconfig.json"
            - "apps/server/.eslintrc*"

jobs:
    validate:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./apps/server

        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.12.1

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24.11.1
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: ./

            - name: Restore mongodb-memory-server cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/mongodb-binaries
                  key: mongo-binaries-${{ runner.os }}-8.0.4
                  restore-keys: mongo-binaries-${{ runner.os }}-

            - name: Build dependencies
              run: pnpm run build:deps
              working-directory: ./

            - name: Type check
              run: pnpm run check-types

            - name: Lint
              run: pnpm run lint

            - name: Test
              run: pnpm run test
              env:
                  CI: true
                  MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries
                  MONGOMS_PREFER_GLOBAL_PATH: "1"

            - name: Build
              run: pnpm run build
